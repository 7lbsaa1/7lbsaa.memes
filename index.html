<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050914">
  <title>تم تجديد رابط الموقع</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050914;
    }

    body {
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    .page {
      width: 100vw;
      height: 100vh;
      cursor: pointer;
    }

    .page img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }
  </style>
</head>

<body>

  <div class="page" onclick="goToWebsite()">
    <img src="no.png" alt="تم تجديد رابط الموقع">
  </div>

  <script>
    function goToWebsite() {
      window.location.href = "https://memes-7lbsaa.vercel.app/";
    }
  </script>

</body>
</html>
